play: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.4px">Check your email</h1><p style="margin: 0; font-size: 17px; line-height: 23px; color: #4A5750">Enter the 6-digit code we sent to you@example.com. It works for 10 minutes.</p></div><div role="group" aria-label="6-digit code" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px"><span style="height: 56px; border-radius: 12px; background: #FFFFFF; box-shadow: inset 0 0 0 2px #4A82AB; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700"></span><span style="height: 56px; border-radius: 12px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #C9D0C8; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700"></span><span style="height: 56px; border-radius: 12px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #C9D0C8; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700"></span><span style="height: 56px; border-radius: 12px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #C9D0C8; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700"></span><span style="height: 56px; border-radius: 12px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #C9D0C8; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700"></span><span style="height: 56px; border-radius: 12px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #C9D0C8; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700"></span></div><a href="Consent.dc.html" style="min-height: 52px; border-radius: 14px; background: #3B6A4A; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Verify</a><div style="display: flex; justify-content: space-between"><span style="min-height: 44px; display: flex; align-items: center; font-size: 15px; color: #4A5750">Resend code in 0:30</span><button onClick="{{ changeEmail }}" style="min-height: 44px; border: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 700; color: #3B6A4A; cursor: pointer">Use a different email</button></div></div></sc-if></div></main></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 'email' }; }
  renderVals() {
    const code = this.state.step === 'code';
    return {
      onEmail: !code, onCode: code,
      sendCode: () => this.setState({ step: 'code' }),
      changeEmail: () => this.setState({ step: 'email' })
    };
  }
}
</script>
