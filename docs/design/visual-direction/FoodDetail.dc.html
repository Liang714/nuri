dth="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7F8882" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span></button><div style="height: 1px; background: #E7EBE5; margin-left: 16px"></div><button style="min-height: 48px; padding: 0 16px; border: none; background: transparent; font-family: inherit; font-size: 15px; color: #17211B; display: flex; align-items: center; justify-content: space-between; cursor: pointer">Time<span style="color: #4A5750; display: flex; align-items: center; gap: 6px">Today, 12:30<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7F8882" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span></button></div></div><div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; flex-direction: column; gap: 10px"><sc-if value="{{ notAdded }}" hint-placeholder-val="{{ true }}"><button onClick="{{ add }}" style="width: 100%; min-height: 52px; border: none; border-radius: 14px; background: #3B6A4A; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Add to lunch</button></sc-if><sc-if value="{{ added }}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 10px"><div role="status" style="background: #17211B; color: #FFFFFF; border-radius: 14px; padding: 4px 6px 4px 14px; display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 11px; background: #2E5539; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Added to lunch</span><button onClick="{{ undo }}" style="min-height: 44px; padding: 0 12px; border: non <script type="text/x-dc" data-dc-script data-props='{"numbersHidden":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { unit: 'bowl', bowls: 1, grams: 210, added: false }; }
  renderVals() {
    const s = this.state;
    const hidden = this.props.numbersHidden ?? false;
    const g = s.unit === 'bowl' ? Math.round(210 * s.bowls) : s.grams;
    const per = g / 100;
    const bowlText = (s.bowls % 1 === 0 ? String(s.bowls) : s.bowls.toFixed(1)) + (s.bowls === 1 ? ' bowl' : ' bowls');
    const title = s.unit === 'bowl' ? bowlText : g + ' g';
    const atMin = s.unit === 'bowl' ? s.bowls <= 0.5 : s.grams <= 10;
    const on = { bg: '#FFFFFF', shadow: '0 1px 3px rgba(23,33,27,0.18), inset 0 0 0 1px #B9C1BB' };
    const off = { bg: 'transparent', shadow: 'none' };
    const b = s.unit === 'bowl' ? on : off, gr = s.unit === 'gram' ? on : off;
    return {
      showNumbers: !hidden,
      hideNumbers: hidden,
      portionTitle: title,
      portionSub: hidden ? 'Adjust to what you had' : (s.unit === 'bowl' ? g + ' g' : 'about ' + (g / 210).toFixed(1) + ' bowl'),
      portionSpoken: 'Portion, ' + title + (hidden ? '' : ', ' + g + ' grams'),
      kcal: Math.round(130 * per), carbs: (28.2 * per).toFixed(1), protein: (2.7 * per).toFixed(1), fat: (0.3 * per).toFixed(1),
      bowlChecked: s.unit === 'bowl' ? 'true' : 'false', gramChecked: s.unit === 'gram' ? 'true' : 'false',
      bowlBg: b.bg, bowlShadow: b.shadow, gramBg: gr.bg, gramShadow: gr.shadow,
      atMin: atMin, lessOpacity: atMin ? '0.4' : '1',
      useBowl: () => this.setState({ unit: 'bowl' }),
      useGram: () => this.setState({ unit: 'gram', grams: g }),
      less: () => atMin ? null : (s.unit === 'bowl' ? this.setState({ bowls: s.bowls - 0.5 }) : this.setState({ grams: s.grams - 10 })),
      more: () => s.unit === 'bowl' ? this.setState({ bowls: Math.min(5, s.bowls + 0.5) }) : this.setState({ grams: Math.min(1000, s.grams + 10) }),
      added: s.added, notAdded: !s.added,
      add: () => this.setState({ added: true }),
      undo: () => this.setState({ added: false })
    };
  }
}
</script>
