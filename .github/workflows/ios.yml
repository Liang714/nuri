name: ios
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  design-system:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/Packages/NuriDesignSystem
  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest non-beta Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          test -n "$XCODE" || { echo "No non-beta Xcode found in /Applications"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Pick a simulator
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick_simulator.py "$SDK") || exit 1
          test -n "$UDID" || { echo "No matching iPhone simulator"; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Test app
        run: xcodebuild test -project ios/Nuri.xcodeproj -scheme Nuri -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/DerivedData -parallel-testing-enabled NO
  copy-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cd scripts && python3 -m unittest test_lint_copy -v
      - run: python3 scripts/lint_copy.py ios/App/Localizable.xcstrings
      - run: python3 scripts/lint_copy.py ios/Packages/NuriDesignSystem/Sources/DesignSystem/Resources/Localizable.xcstrings
