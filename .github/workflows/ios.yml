name: ios
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  design-system:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/Packages/NuriDesignSystem
  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for rt,devs in sorted(d.items(), reverse=True) if 'iOS' in rt for x in devs if x['name'].startswith('iPhone')]; print(ids[0] if ids else '')")
          test -n "$UDID" || { echo "No iPhone simulator available"; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Test app
        run: xcodebuild test -project ios/Nuri.xcodeproj -scheme Nuri -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/DerivedData -parallel-testing-enabled NO
  copy-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cd scripts && python3 -m unittest test_lint_copy -v
      - run: python3 scripts/lint_copy.py ios/App/Localizable.xcstrings
